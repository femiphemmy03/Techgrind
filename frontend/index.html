<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <title>TechGrind — Learn the Skill. Join a Startup. Become the Employer.</title>

  <link rel="canonical" href="https://www.techgrind.ng/" />

  <!-- Favicon / PWA icons -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

  <script>
    // Runs before paint to avoid a flash of the wrong theme. ThemeProvider takes over after mount.
    (function () {
      try {
        var saved = localStorage.getItem('tg_theme');
        document.documentElement.setAttribute('data-theme', saved === 'dark' ? 'dark' : 'light');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
